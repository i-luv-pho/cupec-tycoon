name: CUPEC build and domain tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned tools from their official repositories
        run: |
          set -eu
          mkdir -p /tmp/cupec-tools
          curl -fL --retry 2 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          unzip -q /tmp/luau.zip -d /tmp/cupec-tools
          curl -fL --retry 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/cupec-tools
          chmod +x /tmp/cupec-tools/*
      - name: Verify economy, save transforms and syntax
        run: |
          set -eu
          /tmp/cupec-tools/luau cupec/tests/economy.luau
          /tmp/cupec-tools/luau cupec/tests/saves.luau
          find cupec -name '*.luau' -print0 | xargs -0 /tmp/cupec-tools/luau-compile --null
      - name: Build Roblox place
        run: /tmp/cupec-tools/rojo build default.project.json -o /tmp/CUPEC-Acquisition-District.rbxlx
